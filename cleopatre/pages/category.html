<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Univers — Cléopâtre Parapharmacie</title>
  <meta name="description" content="Un univers de soins éditorialisé : sélection experte, protocoles et produits choisis avec exigence par la parapharmacie Cléopâtre, Tunis.">
  <link rel="canonical" href="https://para-cleopatre.tn/pages/category.html">
  <meta property="og:type" content="website">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="%2329331F"/><text x="32" y="44" font-family="Georgia,serif" font-size="36" font-style="italic" text-anchor="middle" fill="%23C4A97A">C</text></svg>'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/category.css">
</head>
<body data-page="category">
  <a class="skip-link" href="#main">Aller au contenu</a>

  <main id="main">

    <!-- Héros propre à chaque univers -->
    <header class="chero grain" id="catHero">
      <div class="container chero__grid">
        <div class="chero__copy">
          <nav class="crumbs" aria-label="Fil d’Ariane"><a href="../index.html">Accueil</a><i>/</i><a href="shop.html">Boutique</a><i>/</i><span id="crumbCat"></span></nav>
          <span class="eyebrow eyebrow--bare" id="catEyebrow"></span>
          <h1 class="display-1" id="catName" style="margin-top:14px"></h1>
          <p class="lead" id="catIntro"></p>
        </div>
        <figure class="chero__art" id="catArt" aria-hidden="true"></figure>
      </div>
      <div class="container chero__strip">
        <p class="serif-i" id="catTagline"></p>
        <div class="chips" id="concernChips" style="justify-content:flex-end"></div>
      </div>
    </header>

    <!-- Manifeste de l’univers -->
    <section class="cmanifest container" aria-label="L’esprit de l’univers">
      <span class="num-label" data-reveal><i>—</i>L’esprit du rayon</span>
      <p class="display-2 cmanifest__quote" id="catManifesto"></p>
    </section>

    <!-- Sélection -->
    <section class="section container" aria-label="Sélection de l’univers">
      <header class="sec-head">
        <div class="sec-head__left">
          <span class="num-label" data-reveal><i>·</i>La sélection</span>
          <h2 class="display-2" id="selTitle" data-reveal style="--d:1"></h2>
        </div>
        <div class="sec-head__side" data-reveal style="--d:2">
          <label class="sort-label" for="sortSel">Trier&nbsp;:</label>
          <select id="sortSel" class="sort-sel" aria-label="Trier les produits">
            <option value="featured">Notre sélection</option>
            <option value="price-asc">Prix croissant</option>
            <option value="price-desc">Prix décroissant</option>
            <option value="rating">Les mieux notés</option>
          </select>
        </div>
      </header>
      <div class="cgrid" id="catGrid"></div>
      <div class="noresult" id="noResult" hidden>
        <p class="display-2 serif-i">Ce filtre attend sa première référence.</p>
        <button class="btn btn--ink" id="clearConcern">Voir tout l’univers</button>
      </div>
      <p style="margin-top:clamp(36px,5vw,60px)" data-reveal>
        <a class="link-u" href="shop.html">Élargir à toute la boutique<span class="arr">?</span></a>
      </p>
    </section>
  </main>

  <script src="../data/products.js"></script>
  <script src="../data/brands.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../js/global.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/category.js"></script>
</body>
</html>
