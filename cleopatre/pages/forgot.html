<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Mot de passe oublié — Cléopâtre</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
  <meta name="description" content="Mot de passe oublié ? Recevez un lien de réinitialisation sécurisé pour votre compte Cléopâtre.">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <main id="main">
    <header class="page-head grain"><div class="container"><nav class="crumbs"><a href="../index.html">Accueil</a><i>/</i><span>Mot de passe</span></nav><h1 class="display-1" style="margin-top:16px">Mot de passe<br><em class="serif-i">oublié ?</em></h1></div></header>
    <section class="section container"><div class="auth-wrap">
      <p style="font-size:.9rem;color:var(--muted);text-align:center;margin-bottom:18px">Saisissez votre adresse e-mail. Si un compte existe, vous recevrez un lien de réinitialisation.</p>
      <div class="auth-error" id="err" role="alert"></div>
      <div class="auth-success" id="ok" role="status"></div>
      <form class="auth-form" id="forgotForm">
        <div class="field"><label for="email">Adresse e-mail *</label><input id="email" type="email" required></div>
        <button class="btn btn--ink btn--wide" type="submit" id="btn">Envoyer le lien<span class="arr">?</span></button>
        <p class="auth-alt"><a href="login.html">Retour connexion</a></p>
      </form>
      <div id="debug" style="margin-top:18px;font-size:.78rem;color:var(--muted);display:none"></div>
    </div></section>
  </main>
  <script src="../data/products.js"></script>
  <script src="../data/brands.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../js/global.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
  (function(){
    const C=window.CLEO, API=window.CLEO_API; const $=C.$;
    C.onReady(()=>{
      const form=document.getElementById("forgotForm"), err=document.getElementById("err"), ok=document.getElementById("ok"), btn=document.getElementById("btn"), dbg=document.getElementById("debug");
      form.addEventListener("submit", async e=>{
        e.preventDefault(); err.classList.remove("is-on"); ok.classList.remove("is-on"); dbg.style.display="none";
        const email=document.getElementById("email").value.trim();
        btn.textContent="Envoi…"; btn.disabled=true;
        try{
          const res=await API.forgotPassword({email});
          ok.textContent=res.message||"E-mail envoyé si le compte existe.";
          ok.classList.add("is-on");
          if(res.data && res.data.debug_token){
            dbg.style.display="block";
            dbg.innerHTML=`<b>Mode développement — jeton :</b><br><code style="word-break:break-all;background:var(--bg);padding:8px;display:block;margin-top:8px">${res.data.debug_token}</code>
            <a href="reset.html?token=${encodeURIComponent(res.data.debug_token)}" class="link-u" style="margin-top:10px;display:inline-flex">Réinitialiser maintenant ?</a>`;
          }
        }catch(ex){ err.textContent=ex.message; err.classList.add("is-on"); }
        finally{ btn.textContent="Envoyer le lien ?"; btn.disabled=false; }
      });
    });
  })();
  </script>
</body>
</html>
