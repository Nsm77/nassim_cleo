<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Super Admin — Connexion | Cléopâtre</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <main id="main" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)">
    <div style="max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:32px">
      <div style="text-align:center;margin-bottom:24px">
        <b style="font-family:var(--serif);letter-spacing:.14em;text-transform:uppercase">Cléopâtre</b><br>
        <small style="letter-spacing:.22em;text-transform:uppercase;color:var(--gold)">Super Administration</small>
        <h1 class="serif" style="margin-top:16px;font-size:1.6rem">Connexion Super Admin</h1>
        <p style="font-size:.86rem;color:var(--muted);margin-top:8px">Réservé à nssm@cleopatre.tn — accès complet.</p>
      </div>
      <div class="auth-error" id="err"></div>
      <div class="auth-success" id="ok"></div>
      <form class="auth-form" id="loginForm" novalidate>
        <div class="field"><label for="email">Identifiant administrateur *</label><input id="email" type="text" inputmode="text" autocomplete="username" placeholder="nssm" required></div>
        <div class="field"><label for="pwd">Mot de passe *</label><input id="pwd" type="password" autocomplete="current-password" required></div>
        <button class="btn btn--ink btn--wide" type="submit" id="btn">Se connecter<span class="arr">→</span></button>
      </form>
      <p style="text-align:center;margin-top:16px;font-size:.78rem;color:var(--muted)"><a href="../index.html" class="link-u" style="font-size:.72rem">? Retour boutique</a></p>
    </div>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/global.js"></script>
  <script>
  (function(){
    const $=s=>document.querySelector(s);
    // Si déjà — connecté en tant qu'admin, aller directement au panel — sans délai, sans history pollué
    (async()=>{
      try{
        const me=await window.CLEO_API.me();
        if(me.authenticated && me.user.role==='super_admin'){
          location.replace("index.html");
        } else if(me.authenticated && me.user.role==='admin'){
          const e=$("#err"); e.textContent="Ce compte est Admin produits — allez sur /admin/login.html . Super Admin requis ici (nssm@cleopatre.tn)."; e.classList.add("is-on");
        } else if(me.authenticated){
          const e=$("#err"); e.textContent="Ce compte n’a pas les droits Super Admin."; e.classList.add("is-on");
        }
      }catch(err){ console.warn("[super/login] me() failed", err); }
    })();
    document.getElementById("loginForm").addEventListener("submit", async e=>{
      e.preventDefault();
      const err=$("#err"), ok=$("#ok"), btn=$("#btn");
      err.classList.remove("is-on"); err.textContent="";
      ok.classList.remove("is-on"); ok.textContent="";
      const email=$("#email").value.trim(), pwd=$("#pwd").value;
      if(!email || !pwd){ err.textContent="Veuillez renseigner identifiant et mot de passe."; err.classList.add("is-on"); return; }
      btn.textContent="Vérification…"; btn.disabled=true;
      try{
        await window.CLEO_API.login({email, password:pwd});
        const me=await window.CLEO_API.me();
        if(!me.authenticated || me.user.role !== 'super_admin'){
          if(me.authenticated && me.user.role==='admin'){
            err.textContent="Accès réservé au Super Admin. Votre compte Admin → /admin/login.html";
          } else {
            err.textContent="Accès réservé au Super Admin (nssm@cleopatre.tn).";
          }
          err.classList.add("is-on");
          try{ await window.CLEO_API.logout(); }catch(e){}
          return;
        }
        ok.textContent="Connexion réussie — redirection…"; ok.classList.add("is-on");
        // Immédiat, pas de setTimeout aléatoire — location.replace évite retour arrière cassé
        location.replace("index.html");
      }catch(ex){
        const msg=(ex && ex.message) ? ex.message : "Identifiants invalides.";
        err.textContent=msg;
        err.classList.add("is-on");
        console.warn("[admin/login] login failed", ex);
        if(ex && ex.status===429) err.textContent="Trop de tentatives — patientez 15 minutes.";
      }finally{ btn.textContent="Se connecter ?"; btn.disabled=false; }
    });
  })();
  </script>
</body>
</html>
