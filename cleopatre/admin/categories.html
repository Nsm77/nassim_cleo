<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Catégories — Admin Cléopâtre</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="admin-side" id="adminSide"><div class="admin-brand"><b>Cléopâtre</b><small>Administration · Produits</small><small class="brand-sub2">Gestion catalogue</small></div>      <nav class="admin-nav" id="sideNav">
        <a href="index.html"><span class="nav-icon">◧</span> Tableau de bord</a>
        <a href="products.html"><span class="nav-icon">◇</span> Produits</a>
        <a href="categories.html" class="is-on"><span class="nav-icon">▤</span> Catégories</a>
        <a href="brands.html"><span class="nav-icon">⬢</span> Marques</a>
        <a href="inventory.html"><span class="nav-icon">▦</span> Stocks</a>
        <div class="nav-sep"></div>
        <div class="nav-label">Compte</div>
        <a href="#" id="logout"><span class="nav-icon">↪</span> Déconnexion</a>
        <a href="../index.html"><span class="nav-icon">←</span> Boutique</a>
        <a href="../super-admin/index.html" id="superLink" style="display:none;color:var(--admin-gold)"><span class="nav-icon">★</span> Super Admin</a>
      </nav></aside>
    <div>
      <header class="admin-top"><div style="display:flex;gap:10px;align-items:center"><!-- desktop-only: mobile toggle removed --><div><h1>Catégories</h1><small>Univers & sous-catégories avec compte produits</small></div></div><button class="btn btn--ink btn--sm" id="newBtn">+ Catégorie</button></header>
      <div class="admin-content">
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Catégorie</th><th>Slug</th><th>Produits</th><th>Sous-catégories</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
        <div class="card" style="margin-top:16px"><div class="card-head"><h2>Ajouter sous-catégorie</h2></div><div style="padding:16px;display:flex;gap:8px;flex-wrap:wrap"><select id="subParent"></select><input id="subName" placeholder="Nom sous-catégorie"><input id="subSlug" placeholder="slug (auto)"><button class="btn btn--ink btn--sm" id="subCreate">Créer</button></div></div>
      </div>
    </div>
  </div>
  <!-- desktop-only: bottom nav removed -->
  <div class="toast-zone" id="toastZone"></div>
  <div class="modal-admin" id="modal"><div class="modal-panel"><h3 style="font-family:var(--serif)">Nouvelle catégorie</h3><div style="display:grid;gap:10px;margin-top:12px"><input id="cSlug" placeholder="slug (ex: visage)"><input id="cName" placeholder="Nom *"><input id="cTagline" placeholder="Tagline"><textarea id="cDesc" placeholder="Description" style="border:1px solid var(--admin-line);padding:10px;border-radius:8px"></textarea><div style="display:flex;gap:8px"><button class="btn btn--ink btn--sm" id="cSave">Créer</button><button class="btn btn--ghost btn--sm" data-close>Annuler</button></div></div></div></div>
  <script src="../js/api.js"></script>
  <script>
  (function(){
    const API=window.CLEO_API, $=s=>document.querySelector(s);
    function toast(m,t='info'){ const z=$("#toastZone"); const n=document.createElement('div'); n.className='toast '+t; n.textContent=m; z.appendChild(n); setTimeout(()=>{n.style.opacity='0';setTimeout(()=>n.remove(),300)},3000)}
    async function guard(){ const me=await API.me(); if(!me.authenticated||!["admin","super_admin","manager","staff"].includes(me.user.role)) location.href="login.html"; else init(); }
    async function init(){
      $("#logout").addEventListener("click", async e=>{e.preventDefault();await API.logout();location.href="login.html";});
      /* desktop-only: navToggle removed */
      $("#newBtn").addEventListener("click", ()=> $("#modal").classList.add("is-on"));
      document.querySelectorAll("[data-close]").forEach(b=> b.addEventListener("click", ()=> b.closest(".modal-admin").classList.remove("is-on")));
      $("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") e.currentTarget.classList.remove("is-on")});
      $("#cSave").addEventListener("click", async()=>{
        try{ await API.admin.categoryCreate({slug:$("#cSlug").value.trim()||undefined, name:$("#cName").value.trim(), tagline:$("#cTagline").value.trim(), description:$("#cDesc").value.trim()}); toast("Créée","ok"); $("#modal").classList.remove("is-on"); load(); }catch(e){ toast(e.message,"err")}
      });
      $("#subCreate").addEventListener("click", async()=>{
        const payload={action:"create_subcategory", category_slug:$("#subParent").value, name:$("#subName").value.trim(), slug:$("#subSlug").value.trim()||undefined};
        try{ await fetch("../api/admin/categories.php",{method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json","X-CSRF-Token":API.csrfToken}, body:JSON.stringify(payload)}).then(r=>r.json()).then(j=>{if(!j.success)throw new Error(j.message)}); toast("Sous-catégorie créée","ok"); load(); }catch(e){ toast(e.message,"err")}
      });
      load();
    }
    async function load(){
      $("#tbody").innerHTML=`<tr><td colspan="5" style="text-align:center;color:var(--admin-muted)">Chargement…</td></tr>`;
      try{
        const res=await API.admin.categories();
        const rows=res.data.categories||[];
        $("#tbody").innerHTML=rows.map(c=>`<tr><td><b>${c.name}</b><br><small style="color:var(--admin-muted)">${c.tagline||""}</small></td><td>${c.slug}</td><td>${c.product_count}</td><td>${(c.subcategories||[]).map(s=>`<span class="badge badge--neutral" style="margin:2px">${s.name} (${s.product_count})</span>`).join("")||"—"}</td><td><button class="btn btn--ghost btn--sm" data-del="${c.slug}" style="color:var(--admin-danger)">Suppr.</button></td></tr>`).join("");
        const sel=$("#subParent"); sel.innerHTML=rows.map(c=>`<option value="${c.slug}">${c.name}</option>`).join("");
        document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", async()=>{
          if(!confirm("Supprimer catégorie ? Prod. liés bloquent.")) return;
          try{ await fetch(`../api/admin/categories.php?slug=${encodeURIComponent(b.dataset.del)}`,{method:"DELETE", credentials:"same-origin", headers:{"X-CSRF-Token":API.csrfToken}}).then(r=>r.json()).then(j=>{if(!j.success)throw new Error(j.message)}); toast("Supprimée","ok"); load(); }catch(e){ toast(e.message,"err")}
        }));
      }catch(e){ $("#tbody").innerHTML=`<tr><td colspan="5" style="color:#8A3A1F">${e.message}</td></tr>`; }
    }
    guard();
  })();
  </script>
</body>
</html>
