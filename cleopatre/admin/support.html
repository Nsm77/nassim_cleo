<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Support — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="admin-side" id="adminSide"><div class="admin-brand"><b>Cléopâtre</b><small>Administration</small></div><nav class="admin-nav"><a href="index.html">? Tableau</a><a href="orders.html">? Commandes</a><a href="products.html">? Produits</a><a href="support.html" class="is-on">? Support</a><a href="reviews.html">? Avis</a><a href="customers.html">? Clients</a><div class="nav-sep"></div><a href="../index.html">? Boutique</a><a href="#" id="logout">? Déconnexion</a></nav></aside>
    <div>
      <header class="admin-top"><div style="display:flex;gap:10px;align-items:center"><!-- desktop-only: mobile toggle removed --><div><h1>Support</h1><small>Tickets clients</small></div></div><div class="filters"><select id="status"><option value="">Tous</option><option value="open">Ouvert</option><option value="waiting">En attente</option><option value="resolved">Résolu</option><option value="closed">Fermé</option></select><button class="btn btn--ink btn--sm" id="filter">Filtrer</button></div></header>
      <div class="admin-content">
        <div style="display:grid;grid-template-columns:1fr 1.1fr;gap:16px" class="responsive-grid">
          <div class="card"><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Client</th><th>Sujet</th><th>Statut</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination" id="pag"></div></div>
          <div class="card" id="detailCard" style="display:none"><div class="card-head"><h2 id="detailTitle">Ticket</h2><span id="detailStatus"></span></div><div style="padding:16px;display:grid;gap:12px"><div id="messages" style="display:grid;gap:10px;max-height:360px;overflow:auto"></div><textarea id="reply" rows="3" placeholder="Réponse…" style="border:1px solid var(--admin-line);padding:10px;border-radius:8px"></textarea><label style="display:flex;gap:6px;align-items:center;font-size:.84rem"><input type="checkbox" id="internal"> Note interne (non visible client)</label><div style="display:flex;gap:8px"><select id="newStatus" style="border:1px solid var(--admin-line);padding:8px;border-radius:8px"><option value="">Conserver statut</option><option value="open">Ouvert</option><option value="waiting">En attente</option><option value="resolved">Résolu</option><option value="closed">Fermé</option></select><button class="btn btn--ink btn--sm" id="send">Envoyer</button></div></div></div>
        </div>
      </div>
    </div>
  </div>
  <!-- desktop-only: bottom nav removed -->
  <div class="toast-zone" id="toastZone"></div>
  <script src="../js/api.js"></script>
  <script>
  (function(){
    const API=window.CLEO_API, $=s=>document.querySelector(s);
    function toast(m,t='info'){ const z=$("#toastZone"); const n=document.createElement('div'); n.className='toast '+t; n.textContent=m; z.appendChild(n); setTimeout(()=>{n.style.opacity='0';setTimeout(()=>n.remove(),300)},3000)}
    let selected=null, page=1;
    async function guard(){ const me=await API.me(); if(!me.authenticated||!["admin","super_admin","manager","staff"].includes(me.user.role)) location.href="login.html"; else init(); }
    async function init(){
      $("#logout").addEventListener("click", async e=>{e.preventDefault();await API.logout();location.href="login.html";});
      /* desktop-only: navToggle removed */
      $("#filter").addEventListener("click", ()=> load(1));
      $("#send").addEventListener("click", send);
      load(1);
    }
    async function load(p=1){
      page=p;
      const status=$("#status").value;
      $("#tbody").innerHTML=`<tr><td colspan="4" style="text-align:center;color:var(--admin-muted)">Chargement…</td></tr>`;
      try{
        const res=await API.admin.supportTickets({page, per_page:15, status});
        const rows=res.data.tickets||[];
        if(!rows.length) $("#tbody").innerHTML=`<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--admin-muted)">Aucun ticket.</td></tr>`;
        else $("#tbody").innerHTML=rows.map(t=>`<tr style="cursor:pointer" data-id="${t.id}"><td><b>${t.ticket_number}</b><br><small style="color:var(--admin-muted)">${new Date(t.created_at).toLocaleDateString("fr-TN")}</small></td><td>${t.first_name} ${t.last_name}<br><small style="color:var(--admin-muted)">${t.email}</small></td><td>${t.subject}</td><td><span class="badge ${t.status==='open'?'badge--red':t.status==='waiting'?'badge--amber':'badge--green'}">${t.status}</span></td></tr>`).join("");
        document.querySelectorAll("[data-id]").forEach(tr=> tr.addEventListener("click", ()=> openTicket(tr.dataset.id)));
        const pg=res.data.pagination; const pag=$("#pag"); pag.innerHTML="";
        if(pg.total_pages>1) for(let i=1;i<=pg.total_pages;i++){ const b=document.createElement("button"); b.textContent=i; if(i===pg.page) b.classList.add("is-on"); b.addEventListener("click",()=>load(i)); pag.appendChild(b); }
      }catch(e){ $("#tbody").innerHTML=`<tr><td colspan="4" style="color:#8A3A1F">${e.message}</td></tr>`; }
    }
    async function openTicket(id){
      selected=id;
      $("#detailCard").style.display="block";
      $("#messages").innerHTML="Chargement…";
      try{
        const msgs=await fetch(`../api/support/messages.php?ticket_id=${id}`,{credentials:"same-origin"}).then(r=>r.json());
        // fallback to admin view: tickets detail not yet
        const ticketList=await API.admin.supportTickets({per_page:50});
        const t=(ticketList.data.tickets||[]).find(x=>String(x.id)===String(id));
        if(t){ $("#detailTitle").textContent=t.ticket_number+" · "+t.subject; $("#detailStatus").innerHTML=`<span class="badge badge--neutral">${t.status}</span>`; }
        if(msgs.data && msgs.data.messages){
          $("#messages").innerHTML=msgs.data.messages.map(m=>`<div style="padding:10px;border:1px solid var(--admin-line);border-radius:8px;background:${m.is_internal?'#FFF8E6':'var(--admin-surface)'}"><small style="color:var(--admin-muted)">${new Date(m.created_at).toLocaleString("fr-TN")} · ${m.is_internal?'Interne':''}</small><div style="margin-top:4px">${m.message}</div></div>`).join("")||"<p style='color:var(--admin-muted)'>Aucun message</p>";
        } else {
          // try admin support messages via fetch
          const r=await fetch(`../api/admin/support.php?ticket_id=${id}`,{credentials:"same-origin"}).then(r=>r.json()).catch(()=>null);
          if(r && r.data) $("#messages").innerHTML="—";
        }
      }catch(e){ $("#messages").textContent=e.message; }
    }
    async function send(){
      const msg=$("#reply").value.trim(); if(!msg) return toast("Message vide","err");
      const status=$("#newStatus").value;
      const internal=$("#internal").checked;
      try{ await API.admin.supportReply({ticket_id:selected, message:msg, status:status||undefined, is_internal: internal?1:0}); toast("Envoyé","ok"); $("#reply").value=""; openTicket(selected); load(page); }catch(e){ toast(e.message,"err")}
    }
    guard();
  })();
  </script>

  <script>
  // Guard: normal Admin (products only) cannot access this page — redirect to products
  (function(){
    const _origMe = window.CLEO_API && window.CLEO_API.me;
    // Delay check after load
    document.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const me=await window.CLEO_API.me();
        if(me.authenticated && me.user.role==='admin'){
          document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--admin-bg)"><div style="max-width:520px;background:var(--admin-surface);border:1px solid var(--admin-line);border-radius:12px;padding:32px;text-align:center"><h2 style="font-family:var(--serif)">Accès réservé au Super Admin</h2><p style="color:var(--admin-muted);margin-top:12px">Votre rôle <b>Admin</b> donne accès uniquement à la gestion produits (catalogue, stocks, catégories, marques). Cette page nécessite le rôle <b>Super Admin</b> (nssm@cleopatre.tn).</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><a class="btn btn--ink" href="products.html">Aller aux produits</a><a class="btn btn--ghost" href="index.html">Tableau de bord</a></div><p style="font-size:.78rem;color:var(--admin-muted);margin-top:16px">Tentative d’accès direct à une API restreinte renverra <code>403 Permission insuffisante</code> — vérification serveur.</p></div></div>';
        }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
