<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Fiche client — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="admin-side" id="adminSide"><div class="admin-brand"><b>Cléopâtre</b><small>Administration</small></div><nav class="admin-nav"><a href="index.html">? Tableau</a><a href="orders.html">? Commandes</a><a href="customers.html" class="is-on">? Clients</a><a href="products.html">? Produits</a><div class="nav-sep"></div><a href="../index.html">? Boutique</a><a href="#" id="logout">? Déconnexion</a></nav></aside>
    <div>
      <header class="admin-top"><div style="display:flex;gap:10px;align-items:center"><!-- desktop-only: mobile toggle removed --><div><h1 id="title">Client</h1><small id="sub"></small></div></div><a class="btn btn--ghost btn--sm" href="customers.html">? Retour</a></header>
      <div class="admin-content" id="content"><div class="card"><div style="padding:24px;text-align:center;color:var(--admin-muted)">Chargement…</div></div></div>
    </div>
  </div>
  <!-- desktop-only: bottom nav removed -->
  <div class="toast-zone" id="toastZone"></div>
  <script src="../js/api.js"></script>
  <script>
  (function(){
    const API=window.CLEO_API, $=s=>document.querySelector(s);
    const fmt=m=> (m/1000).toFixed(3).replace(".",",")+" DT";
    function toast(m,t='info'){ const z=$("#toastZone"); const n=document.createElement('div'); n.className='toast '+t; n.textContent=m; z.appendChild(n); setTimeout(()=>{n.style.opacity='0';setTimeout(()=>n.remove(),300)},3000)}
    async function guard(){ const me=await API.me(); if(!me.authenticated||!["admin","super_admin","manager","staff"].includes(me.user.role)) location.href="login.html"; else load(); }
    async function load(){
      $("#logout").addEventListener("click",async e=>{e.preventDefault();await API.logout();location.href="login.html";});
      /* desktop-only: navToggle removed */
      const id=new URLSearchParams(location.search).get("id");
      if(!id){ $("#content").innerHTML="<p>ID manquant.</p>"; return; }
      try{
        const res=await API.admin.customer(id);
        const c=res.data.customer, stats=res.data.stats, orders=res.data.orders||[], addrs=res.data.addresses||[];
        $("#title").textContent=`${c.first_name} ${c.last_name}`;
        $("#sub").innerHTML=`${c.email} · ${c.phone||""} · Inscrit le ${new Date(c.created_at).toLocaleDateString("fr-TN")} · <a href="mailto:${c.email}" style="color:var(--admin-gold)">Contacter</a>`;
        // fetch tags, notes, loyalty, wishlist — avec diagnostics explicites
        let tags=[], notes=[], loyalty=null, wishCount=stats.wishlist_count;
        try{ const r=await API.admin.customerTags(id); tags=r.data.tags||[]; }catch(err){ console.warn("[customer] tags failed", err); }
        try{ const r=await API.admin.customerNotes(id); notes=r.data.notes||[]; }catch(err){ console.warn("[customer] notes failed", err); }
        try{ const r=await API.admin.loyaltyDetail(id); loyalty=r.data.account||null; }catch(err){ console.warn("[customer] loyalty failed", err); }
        $("#content").innerHTML=`
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
            <div class="kpi-card"><span class="kpi-label">Commandes</span><b class="kpi-value">${stats.order_count}</b></div>
            <div class="kpi-card green"><span class="kpi-label">Total dépensé</span><b class="kpi-value">${fmt(stats.total_spent)}</b></div>
            <div class="kpi-card"><span class="kpi-label">Favoris</span><b class="kpi-value">${wishCount}</b></div>
            <div class="kpi-card gold"><span class="kpi-label">Fidélité</span><b class="kpi-value">${loyalty? loyalty.balance+" pts":"—"}</b><small>${loyalty? loyalty.tier:""}</small></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px" class="responsive-grid">
            <div class="card"><div class="card-head"><h2>Informations</h2><span class="badge ${c.status==='active'?'badge--green':c.status==='suspended'?'badge--amber':'badge--red'}">${c.status}</span></div><div style="padding:16px;display:grid;gap:8px;font-size:.9rem">
              <div><b>Nom :</b> ${c.first_name} ${c.last_name}</div>
              <div><b>E-mail :</b> ${c.email}</div>
              <div><b>Téléphone :</b> ${c.phone||"—"}</div>
              <div><b>Rôle :</b> ${c.role}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${tags.map(t=>`<span class="badge badge--amber">${t.tag} <button data-rm="${t.tag}" style="margin-left:6px;color:var(--admin-danger)">×</button></span>`).join("")||"<small style='color:var(--admin-muted)'>Aucun tag</small>"}</div>
              <div style="display:flex;gap:8px;margin-top:8px"><select id="newTag" style="flex:1;border:1px solid var(--admin-line);padding:8px;border-radius:8px"><option value="">Ajouter tag…</option><option value="VIP">VIP</option><option value="High Value">High Value</option><option value="Regular">Regular</option><option value="New">New</option><option value="Potential VIP">Potential VIP</option><option value="Support Required">Support Required</option></select><button class="btn btn--ghost btn--sm" id="addTag">Ajouter</button></div>
              <div style="display:flex;gap:8px;margin-top:12px">
                ${c.status==="active"?`<button class="btn btn--ghost btn--sm" data-act="suspend">Suspendre</button> <button class="btn btn--ghost btn--sm" data-act="disable" style="color:var(--admin-danger)">Désactiver</button>`:
                  c.status==="suspended"?`<button class="btn btn--ghost btn--sm" data-act="activate">Réactiver</button>`:
                  `<button class="btn btn--ghost btn--sm" data-act="activate">Réactiver</button>`}
                <button class="btn btn--ghost btn--sm" id="editBtn">Éditer</button>
              </div>
            </div></div>
            <div class="card"><div class="card-head"><h2>Notes internes (admin only)</h2></div><div style="padding:16px;display:grid;gap:10px">
              <div id="notesList">${notes.length? notes.map(n=>`<div style="padding:10px;border:1px solid var(--admin-line);border-radius:8px;background:#FFF8E6"><small style="color:var(--admin-muted)">${new Date(n.created_at).toLocaleString("fr-TN")} · ${n.admin_first||"Admin"}</small><div style="margin-top:4px">${n.note}</div></div>`).join("") : `<p style="color:var(--admin-muted)">Aucune note. Ex: "Préfère livraison l'après-midi"</p>`}</div>
              <div style="display:flex;gap:8px"><input id="newNote" placeholder="Nouvelle note interne…" style="flex:1;border:1px solid var(--admin-line);padding:10px;border-radius:8px"><button class="btn btn--ink btn--sm" id="saveNote">Ajouter</button></div>
            </div></div>
          </div>
          <div class="card" style="margin-top:16px"><div class="card-head"><h2>Adresses (${addrs.length})</h2></div><div style="padding:16px;display:grid;gap:12px">
            ${addrs.length? addrs.map(a=>`<div style="border:1px solid var(--admin-line);padding:12px;border-radius:8px"><b>${a.label||""} ${a.is_default?"· Par défaut":""}</b><br>${a.address}, ${a.postal_code} ${a.city}<br><small style="color:var(--admin-muted)">${a.phone||""}</small></div>`).join("") : `<p style="color:var(--admin-muted)">Aucune adresse.</p>`}
          </div></div>
          <div class="card" style="margin-top:16px"><div class="card-head"><h2>Timeline commande & fidélité</h2></div><div style="padding:16px;display:grid;gap:8px">
            <div><b>Commandes</b><br><div class="table-wrap"><table><thead><tr><th>Commande</th><th>Date</th><th>Total</th><th>Statut</th></tr></thead><tbody>
              ${orders.length? orders.map(o=>`<tr><td><a href="order.html?order_number=${encodeURIComponent(o.order_number)}"><b>${o.order_number}</b></a></td><td>${new Date(o.created_at).toLocaleDateString("fr-TN")}</td><td>${fmt(o.total)}</td><td>${o.status}</td></tr>`).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--admin-muted)">Aucune commande</td></tr>`}
            </tbody></table></div></div>
            <div style="margin-top:12px"><b>Historique fidélité</b><div id="loyHist" style="font-size:.84rem;color:var(--admin-muted)">Chargement…</div></div>
          </div></div>
        `;
        // bind tag
        $("#addTag").addEventListener("click", async()=>{
          const tag=$("#newTag").value; if(!tag) return;
          try{ await API.admin.addCustomerTag(id, tag); toast("Tag ajouté","ok"); load(); }catch(e){ toast(e.message,"err")}
        });
        document.querySelectorAll("[data-rm]").forEach(b=> b.addEventListener("click", async()=>{
          try{ await API.admin.removeCustomerTag(id, b.dataset.rm); toast("Tag retiré","ok"); load(); }catch(e){ toast(e.message,"err")}
        }));
        $("#saveNote").addEventListener("click", async()=>{
          const note=$("#newNote").value.trim(); if(!note) return;
          try{ await API.admin.addCustomerNote(id, note); toast("Note ajoutée","ok"); load(); }catch(e){ toast(e.message,"err")}
        });
        document.querySelectorAll("[data-act]").forEach(b=>{
          b.addEventListener("click", async()=>{
            const act=b.dataset.act;
            if(!confirm(act==="disable"?"Désactiver définitivement ?": act==="suspend"?"Suspendre ?":"Réactiver ?")) return;
            try{ await API.admin.customerStatus(id, act); toast("Mis à jour","ok"); load(); }catch(e){ toast(e.message,"err")}
          });
        });
        try{
          const lh=await API.admin.loyaltyDetail(id);
          const tx=lh.data.transactions||[];
          $("#loyHist").innerHTML= tx.length? tx.map(t=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--admin-line)"><span>${t.type} · ${t.points>0?'+':''}${t.points} pts<br><small style="color:var(--admin-muted)">${t.reference||""} · ${new Date(t.created_at).toLocaleString("fr-TN")}</small></span><b>${t.balance_after}</b></div>`).join("") : "Aucune transaction";
        }catch(e){ console.warn("[customer] loyalty history failed", e); $("#loyHist").innerHTML=`<span style="color:#8A3A1F">Impossible de charger l’historique: ${e.message}</span> <button class="btn btn--ghost btn--sm" onclick="location.reload()">Réessayer</button>`; }
      }catch(e){
        console.error("[customer] load failed", e);
        const is404=e.status===404, is403=e.status===403, is500=e.status>=500;
        let msg=e.message; let hint="";
        if(is404) hint="Client introuvable — vérifiez l’ID.";
        else if(is403) hint="Permissions insuffisantes — reconnectez-vous en admin.";
        else if(is500) hint="Erreur serveur — consultez /api/system/health.php";
        else hint="Vérifiez la connexion API.";
        $("#content").innerHTML=`<div style="padding:24px;text-align:center"><p style="color:#8A3A1F;font-weight:500">Erreur : ${msg}</p><p style="color:var(--admin-muted);font-size:.84rem;margin-top:8px">${hint}</p><button class="btn btn--ink btn--sm" onclick="location.reload()" style="margin-top:12px">Réessayer</button> <a class="btn btn--ghost btn--sm" href="customers.html">Retour liste</a></div>`;
      }
    }
    guard();
  })();
  </script>

  <script>
  // Guard: normal Admin (products only) cannot access this page — redirect to products
  (function(){
    const _origMe = window.CLEO_API && window.CLEO_API.me;
    // Delay check after load
    document.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const me=await window.CLEO_API.me();
        if(me.authenticated && me.user.role==='admin'){
          document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--admin-bg)"><div style="max-width:520px;background:var(--admin-surface);border:1px solid var(--admin-line);border-radius:12px;padding:32px;text-align:center"><h2 style="font-family:var(--serif)">Accès réservé au Super Admin</h2><p style="color:var(--admin-muted);margin-top:12px">Votre rôle <b>Admin</b> donne accès uniquement à la gestion produits (catalogue, stocks, catégories, marques). Cette page nécessite le rôle <b>Super Admin</b> (nssm@cleopatre.tn).</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><a class="btn btn--ink" href="products.html">Aller aux produits</a><a class="btn btn--ghost" href="index.html">Tableau de bord</a></div><p style="font-size:.78rem;color:var(--admin-muted);margin-top:16px">Tentative d’accès direct à une API restreinte renverra <code>403 Permission insuffisante</code> — vérification serveur.</p></div></div>';
        }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
