<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Commandes — Administration Cléopâtre</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="admin-side" id="adminSide">
      <div class="admin-brand"><b>Cléopâtre</b><small>Administration</small><small class="brand-sub2">Commandes · Suivi</small></div>
      <nav class="admin-nav"><a href="index.html">? Tableau</a><a href="orders.html" class="is-on">? Commandes</a><a href="products.html">? Produits</a><a href="inventory.html">? Stocks</a><a href="customers.html">? Clients</a><a href="analytics.html">? Analytics</a><a href="promotions.html">% Promotions</a><a href="settings.html">? Paramètres</a><a href="activity.html">= Activité</a><div class="nav-sep"></div><a href="../index.html">? Boutique</a><a href="#" id="logout">? Déconnexion</a></nav>
    </aside>
    <div>
      <header class="admin-top"><div style="display:flex;gap:10px;align-items:center"><!-- desktop-only: mobile toggle removed --><div><h1>Commandes</h1><small>Filtres : statut, date, client, montant, paiement, livraison, produit</small></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn--ghost btn--sm" id="exportBtn">Export CSV</button><a class="btn btn--ghost btn--sm" href="../api/admin/exports.php?type=orders" target="_blank">Export serveur</a></div></header>
      <div class="admin-content">
        <div class="card">
          <div class="card-head">
            <div class="filters" style="flex:1">
              <input type="search" id="q" placeholder="N° commande, client, e-mail, téléphone" style="min-width:220px">
              <select id="status"><option value="">Tous statuts</option><option value="pending">En attente</option><option value="confirmed">Confirmées</option><option value="preparing">En préparation</option><option value="shipped">Expédiées</option><option value="delivered">Livrées</option><option value="cancelled">Annulées</option></select>
              <input type="date" id="from" title="Du"><input type="date" id="to" title="Au">
              <select id="amount"><option value="">Montant</option><option value="lt50"> &lt; 50 DT</option><option value="50-100">50-100 DT</option><option value="gt100">&gt; 100 DT</option></select>
              <select id="payment"><option value="">Paiement</option><option value="cash_on_delivery">Paiement à la livraison</option></select>
              <button class="btn btn--ink btn--sm" id="searchBtn">Filtrer</button>
              <button class="btn btn--ghost btn--sm" id="reset">Reset</button>
            </div>
          </div>
          <div style="padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap" id="statusChips">
            <button class="chip-filter is-on" data-st="">Tous</button><button class="chip-filter" data-st="pending">En attente</button><button class="chip-filter" data-st="confirmed">Confirmées</button><button class="chip-filter" data-st="preparing">Préparation</button><button class="chip-filter" data-st="shipped">Expédiées</button><button class="chip-filter" data-st="delivered">Livrées</button><button class="chip-filter" data-st="cancelled">Annulées</button>
          </div>
          <div class="table-wrap"><table><thead><tr><th>Commande</th><th>Client</th><th>Total</th><th>Statut</th><th>Date</th><th>Actions rapides</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
          <!-- desktop-only: mobile cards removed -->
          <div class="pagination" id="pag" style="padding:12px 16px"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- desktop-only: bottom nav removed -->
  <div class="toast-zone" id="toastZone"></div>
  <script src="../js/api.js"></script>
  <script>
  (function(){
    const API=window.CLEO_API;
    const $=s=>document.querySelector(s);
    const fmt=m=> (m/1000).toFixed(3).replace(".",",")+" DT";
    const map={pending:"En attente",confirmed:"Confirmée",preparing:"En préparation",shipped:"Expédiée",delivered:"Livrée",cancelled:"Annulée"};
    const nextMap={pending:"confirmed",confirmed:"preparing",preparing:"shipped",shipped:"delivered"};
    let page=1;
    function toast(m,t='info'){ const z=$("#toastZone"); const n=document.createElement('div'); n.className='toast '+t; n.textContent=m; z.appendChild(n); setTimeout(()=>{n.style.opacity='0';setTimeout(()=>n.remove(),300)},3000)}
    async function guard(){ const me=await API.me(); if(!me.authenticated || !["admin","super_admin","manager","staff"].includes(me.user.role)) location.href="login.html"; else init(); }
    async function init(){
      $("#logout").addEventListener("click",async e=>{e.preventDefault();await API.logout();location.href="login.html";});
      /* desktop-only: navToggle removed */
      $("#searchBtn").addEventListener("click",()=>load(1));
      $("#reset").addEventListener("click",()=>{ document.querySelectorAll(".filters input, .filters select").forEach(el=> el.value=""); document.querySelectorAll(".chip-filter").forEach(c=>c.classList.remove("is-on")); document.querySelector('[data-st=""]').classList.add("is-on"); load(1);});
      $("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") load(1); });
      $("#exportBtn").addEventListener("click", exportCsv);
      document.querySelectorAll("[data-st]").forEach(b=> b.addEventListener("click", ()=>{ document.querySelectorAll("[data-st]").forEach(x=>x.classList.remove("is-on")); b.classList.add("is-on"); $("#status").value=b.dataset.st; load(1); }));
      const p=new URLSearchParams(location.search); if(p.get("status")){ $("#status").value=p.get("status"); document.querySelectorAll("[data-st]").forEach(b=>{ b.classList.toggle("is-on", b.dataset.st===p.get("status"))}); }
      load(1);
    }
    async function load(p=1){
      page=p;
      const params={page, per_page:15};
      const q=$("#q").value.trim(); if(q) params.q=q;
      const st=$("#status").value; if(st) params.status=st;
      const from=$("#from").value; if(from) params.from=from;
      const to=$("#to").value; if(to) params.to=to;
      // amount client filter local? server handles status/q/date; amount we filter server via?We'll post-filter
      $("#tbody").innerHTML=`<tr><td colspan="7" style="text-align:center;color:var(--admin-muted)">Chargement…</td></tr>`;
      /* desktop-only mobileCards removed */ void 0; //=`<p style="text-align:center;color:var(--admin-muted)">Chargement…</p>`;
      try{
        const res=await API.admin.orders(params);
        let rows=res.data.orders||[];
        // additional filters: amount
        const amt=$("#amount").value;
        if(amt){
          rows=rows.filter(o=>{
            const tot=o.total/1000;
            if(amt==='lt50') return tot<50;
            if(amt==='50-100') return tot>=50 && tot<=100;
            if(amt==='gt100') return tot>100;
            return true;
          });
        }
        const pay=$("#payment").value;
        if(pay) rows=rows.filter(o=> o.payment_method===pay);
        if(!rows.length){
          $("#tbody").innerHTML=`<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--admin-muted)">Aucune commande.</td></tr>`;
          /* desktop-only mobileCards removed */ void 0; //=`<p style="text-align:center;color:var(--admin-muted)">Aucune commande.</p>`;
        } else {
          $("#tbody").innerHTML=rows.map(o=>{
            const next=nextMap[o.status];
            const canCancel= o.status!=='delivered' && o.status!=='cancelled';
            return `<tr>
              <td><b>${o.order_number}</b><br><small style="color:var(--admin-muted)">${o.payment_method} · ${o.shipping_additional||""}</small></td>
              <td>${o.first_name} ${o.last_name}<br><small style="color:var(--admin-muted)">${o.email}<br>${o.phone||""}</small></td>
              <td>${fmt(o.total)}<br><small style="color:var(--admin-muted)">${fmt(o.subtotal)} - ${fmt(o.discount)} + ${fmt(o.shipping)}</small></td>
              <td><span class="badge badge--neutral">${map[o.status]||o.status}</span></td>
              <td>${new Date(o.created_at).toLocaleString("fr-TN")}</td>
              <td>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  ${next?`<button class="btn btn--ink btn--sm" data-next="${o.id}" data-status="${next}">? ${map[next]}</button>`:""}
                  ${canCancel?`<button class="btn btn--ghost btn--sm" data-cancel="${o.id}" style="color:var(--admin-danger)">Annuler</button>`:""}
                </div>
              </td>
              <td><a class="btn btn--ghost btn--sm" href="order.html?order_number=${encodeURIComponent(o.order_number)}">Voir</a></td>
            </tr>`;
          }).join("");
          /* desktop-only mobileCards removed */ void 0; //=rows.map(o=>{
            const next=nextMap[o.status];
            return `<div class="oc">
              <div class="oc-head"><b>${o.order_number}</b><span class="badge badge--neutral">${map[o.status]||o.status}</span></div>
              <div style="font-size:.82rem">${o.first_name} ${o.last_name} · ${fmt(o.total)}<br><small style="color:var(--admin-muted)">${new Date(o.created_at).toLocaleString("fr-TN")}</small></div>
              <div class="oc-actions">${next?`<button class="btn btn--ink btn--sm" data-next="${o.id}" data-status="${next}">? ${map[next]}</button>`:""}<a class="btn btn--ghost btn--sm" href="order.html?order_number=${encodeURIComponent(o.order_number)}">Voir</a></div>
            </div>`;
          }).join("");
          document.querySelectorAll("[data-next]").forEach(b=> b.addEventListener("click", async()=>{
            const nid=b.dataset.next, st=b.dataset.status;
            const note=prompt("Note interne (optionnelle) pour "+map[st]+" :");
            try{ await API.admin.orderStatus(parseInt(nid), st, note||""); toast("Statut ? "+map[st],"ok"); load(page); }catch(e){ toast(e.message,"err")}
          }));
          document.querySelectorAll("[data-cancel]").forEach(b=> b.addEventListener("click", async()=>{
            if(!confirm("Annuler cette commande ? Stock sera restauré, fidélité remboursée.")) return;
            try{ await API.admin.orderStatus(parseInt(b.dataset.cancel), "cancelled","Annulation depuis liste"); toast("Annulée","ok"); load(page); }catch(e){ toast(e.message,"err")}
          }));
        }
        const pg=res.data.pagination; const pag=$("#pag"); pag.innerHTML="";
        if(pg.total_pages>1){ for(let i=1;i<=pg.total_pages;i++){ const b=document.createElement("button"); b.textContent=i; if(i===pg.page) b.classList.add("is-on"); b.addEventListener("click",()=>load(i)); pag.appendChild(b); } }
        window._lastRows=rows;
      }catch(e){
        $("#tbody").innerHTML=`<tr><td colspan="7" style="color:#8A3A1F;padding:20px">${e.message}</td></tr>`;
      }
    }
    function exportCsv(){
      const rows=window._lastRows||[];
      if(!rows.length){ toast("Rien à exporter","err"); return; }
      let csv="order_number,client,email,total,status,date\n";
      rows.forEach(o=> csv+=`"${o.order_number}","${o.first_name} ${o.last_name}","${o.email}",${o.total},"${o.status}","${o.created_at}"\n`);
      const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="commandes.csv"; a.click(); URL.revokeObjectURL(url);
    }
    guard();
  })();
  </script>

  <script>
  // Guard: normal Admin (products only) cannot access this page — redirect to products
  (function(){
    const _origMe = window.CLEO_API && window.CLEO_API.me;
    // Delay check after load
    document.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const me=await window.CLEO_API.me();
        if(me.authenticated && me.user.role==='admin'){
          document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--admin-bg)"><div style="max-width:520px;background:var(--admin-surface);border:1px solid var(--admin-line);border-radius:12px;padding:32px;text-align:center"><h2 style="font-family:var(--serif)">Accès réservé au Super Admin</h2><p style="color:var(--admin-muted);margin-top:12px">Votre rôle <b>Admin</b> donne accès uniquement à la gestion produits (catalogue, stocks, catégories, marques). Cette page nécessite le rôle <b>Super Admin</b> (nssm@cleopatre.tn).</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><a class="btn btn--ink" href="products.html">Aller aux produits</a><a class="btn btn--ghost" href="index.html">Tableau de bord</a></div><p style="font-size:.78rem;color:var(--admin-muted);margin-top:16px">Tentative d’accès direct à une API restreinte renverra <code>403 Permission insuffisante</code> — vérification serveur.</p></div></div>';
        }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
