<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Messages — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="admin-side"><div class="admin-brand"><b>Cléopâtre</b><small>Administration</small></div><nav class="admin-nav"><a href="index.html">Tableau</a><a href="orders.html">Commandes</a><a href="customers.html">Clients</a><a href="products.html">Produits</a><a href="promotions.html">Promotions</a><a href="settings.html">Paramètres</a><a href="activity.html">Activité</a><a href="contact.html" class="is-on">Messages</a><div class="nav-sep"></div><a href="../index.html">? Boutique</a><a href="#" id="logout">Déconnexion</a></nav></aside>
    <div>
      <header class="admin-top"><div><h1>Messages</h1><small>Boîte de réception contact</small></div></header>
      <div class="admin-content">
        <div class="card"><div class="card-head"><div class="filters"><select id="status"><option value="">Tous</option><option value="new">Nouveaux</option><option value="read">Lus</option><option value="resolved">Résolus</option></select><button class="btn btn--ink btn--sm" id="filter">Filtrer</button></div></div>
        <div class="table-wrap"><table><thead><tr><th>Date</th><th>Nom</th><th>Sujet</th><th>Message</th><th>Statut</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination" id="pag"></div></div>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script>
  (function(){
    const API=window.CLEO_API, $=s=>document.querySelector(s);
    async function guard(){ const me=await API.me(); if(!me.authenticated||!["admin","super_admin","manager","staff"].includes(me.user.role)) location.href="login.html"; else init(); }
    async function init(){
      $("#logout").addEventListener("click",async e=>{e.preventDefault();await API.logout();location.href="login.html";});
      $("#filter").addEventListener("click",()=>load(1));
      load(1);
    }
    async function load(page=1){
      const status=$("#status").value;
      $("#tbody").innerHTML=`<tr><td colspan="6" style="text-align:center;color:#847D6D">Chargement…</td></tr>`;
      try{
        const res=await API.admin.contactMessages({page, per_page:15, status});
        const rows=res.data.messages||[];
        if(!rows.length) $("#tbody").innerHTML=`<tr><td colspan="6" style="text-align:center;padding:20px;color:#847D6D">Aucun message.</td></tr>`;
        else $("#tbody").innerHTML=rows.map(r=>`
          <tr>
            <td>${new Date(r.created_at).toLocaleString("fr-TN")}</td>
            <td><b>${r.name}</b><br><small style="color:#847D6D">${r.email}<br>${r.phone||""}</small></td>
            <td>${r.subject||"—"}</td>
            <td style="max-width:320px;white-space:pre-wrap;font-size:.84rem">${r.message.substring(0,180)}${r.message.length>180?"…":""}</td>
            <td><span class="badge">${r.status}</span></td>
            <td><select data-id="${r.id}" class="statusSel" style="border:1px solid var(--admin-line);padding:4px;border-radius:4px"><option value="new" ${r.status==="new"?"selected":""}>new</option><option value="read" ${r.status==="read"?"selected":""}>read</option><option value="resolved" ${r.status==="resolved"?"selected":""}>resolved</option></select></td>
          </tr>
        `).join("");
        document.querySelectorAll(".statusSel").forEach(s=>{
          s.addEventListener("change", async ()=>{
            const id=s.dataset.id, st=s.value;
            try{ await fetch(`../api/admin/contact.php`,{method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json","X-CSRF-Token":API.csrfToken}, body: JSON.stringify({id, status:st})}).then(r=>r.json()).then(j=>{if(!j.success) throw new Error(j.message)}); load(page); }catch(e){ alert(e.message); }
          });
        });
        const pg=res.data.pagination; const pag=$("#pag"); pag.innerHTML="";
        if(pg.total_pages>1) for(let i=1;i<=pg.total_pages;i++){ const b=document.createElement("button"); b.textContent=i; if(i===pg.page) b.classList.add("is-on"); b.addEventListener("click",()=>load(i)); pag.appendChild(b); }
      }catch(e){ $("#tbody").innerHTML=`<tr><td colspan="6" style="color:#8A3A1F">Erreur : ${e.message}</td></tr>`; }
    }
    guard();
  })();
  </script>

  <script>
  // Guard: normal Admin (products only) cannot access this page — redirect to products
  (function(){
    const _origMe = window.CLEO_API && window.CLEO_API.me;
    // Delay check after load
    document.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const me=await window.CLEO_API.me();
        if(me.authenticated && me.user.role==='admin'){
          document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--admin-bg)"><div style="max-width:520px;background:var(--admin-surface);border:1px solid var(--admin-line);border-radius:12px;padding:32px;text-align:center"><h2 style="font-family:var(--serif)">Accès réservé au Super Admin</h2><p style="color:var(--admin-muted);margin-top:12px">Votre rôle <b>Admin</b> donne accès uniquement à la gestion produits (catalogue, stocks, catégories, marques). Cette page nécessite le rôle <b>Super Admin</b> (nssm@cleopatre.tn).</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><a class="btn btn--ink" href="products.html">Aller aux produits</a><a class="btn btn--ghost" href="index.html">Tableau de bord</a></div><p style="font-size:.78rem;color:var(--admin-muted);margin-top:16px">Tentative d’accès direct à une API restreinte renverra <code>403 Permission insuffisante</code> — vérification serveur.</p></div></div>';
        }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
