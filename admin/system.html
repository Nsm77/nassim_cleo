<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Système — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="admin-side" id="adminSide"><div class="admin-brand"><b>Cléopâtre</b><small>Administration</small></div><nav class="admin-nav"><a href="index.html">? Tableau</a><a href="system.html" class="is-on">? Système</a><a href="admin-users.html">? Équipe</a><a href="activity.html">= Activité</a><div class="nav-sep"></div><a href="../index.html">? Boutique</a><a href="#" id="logout">? Déconnexion</a></nav></aside>
    <div>
      <header class="admin-top"><div style="display:flex;gap:10px;align-items:center"><!-- desktop-only: mobile toggle removed --><div><h1>Système & Santé</h1><small>Health, backup, sécurité</small></div></div><button class="btn btn--ghost btn--sm" id="refresh">? Rafraîchir</button></header>
      <div class="admin-content">
        <div class="card"><div class="card-head"><h2>Santé système</h2><span id="healthBadge"></span></div><div style="padding:16px" id="health"></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="responsive-grid">
          <div class="card"><div class="card-head"><h2>Backup</h2><small>Super Admin only</small></div><div style="padding:16px;display:grid;gap:10px"><p style="font-size:.84rem;color:var(--admin-muted)">Sauvegarde contrôlée de la base SQLite. Fichier stocké dans <code>database/backups/</code>.</p><button class="btn btn--ink btn--sm" id="backupBtn">Créer backup maintenant</button><p id="backupMsg" style="font-size:.78rem"></p></div></div>
          <div class="card"><div class="card-head"><h2>Sécurité</h2></div><div style="padding:16px" id="security"></div></div>
        </div>
        <div class="card"><div class="card-head"><h2>Configuration</h2></div><div style="padding:16px" id="config"></div></div>
      </div>
    </div>
  </div>
  <!-- desktop-only: bottom nav removed -->
  <div class="toast-zone" id="toastZone"></div>
  <script src="../js/api.js"></script>
  <script>
  (function(){
    const API=window.CLEO_API, $=s=>document.querySelector(s);
    function toast(m,t='info'){ const z=$("#toastZone"); const n=document.createElement('div'); n.className='toast '+t; n.textContent=m; z.appendChild(n); setTimeout(()=>{n.style.opacity='0';setTimeout(()=>n.remove(),300)},3000)}
    async function guard(){ const me=await API.me(); if(!me.authenticated||!["admin","super_admin","manager","staff"].includes(me.user.role)) location.href="login.html"; else init(); }
    async function init(){
      $("#logout").addEventListener("click", async e=>{e.preventDefault();await API.logout();location.href="login.html";});
      /* desktop-only: navToggle removed */
      $("#refresh").addEventListener("click", load);
      $("#backupBtn").addEventListener("click", async()=>{
        $("#backupMsg").textContent="Création…";
        try{ const res=await fetch("../api/admin/system.php",{method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json","X-CSRF-Token":API.csrfToken}, body:JSON.stringify({action:"backup"})}).then(r=>r.json()); if(!res.success) throw new Error(res.message); $("#backupMsg").textContent="Backup créé : "+res.data.file; toast("Backup OK","ok"); }catch(e){ $("#backupMsg").textContent=e.message; toast(e.message,"err")}
      });
      load();
    }
    async function load(){
      $("#health").innerHTML=`<p style="color:var(--admin-muted)">Chargement…</p>`;
      $("#security").innerHTML=`<p style="color:var(--admin-muted)">Chargement…</p>`;
      try{
        const h=await API.admin.systemHealth();
        const checks=h.data.checks||{};
        $("#healthBadge").innerHTML=`<span class="badge badge--green">OK</span>`;
        $("#health").innerHTML=Object.entries(checks).map(([k,v])=>`<div class="health-pill ${v==='ok'||v==='connected'||v==='available'||v==='active'||v==='writable'?'ok': v==='missing'?'err':'ok'}"><span>${k}</span><b>${v}</b></div>`).join("");
        $("#config").innerHTML=`<pre style="background:var(--admin-bg);padding:12px;border-radius:8px;font-size:.76rem;overflow:auto">${JSON.stringify(checks,null,2)}</pre>`;
      }catch(e){ $("#health").innerHTML=`<p style="color:#8A3A1F">${e.message}</p>`; $("#healthBadge").innerHTML=`<span class="badge badge--red">Erreur</span>`}
      try{
        const s=await API.admin.security();
        const d=s.data;
        $("#security").innerHTML=`
          <div style="display:grid;gap:10px">
            <div><b>Connexions échouées récentes</b><br><small style="color:var(--admin-muted)">${(d.failed_logins||[]).slice(0,5).map(x=>`${x.bucket} · ${x.created_at}`).join("<br>")||"Aucune"}</small></div>
            <div><b>Sessions admin</b><br>${(d.admin_sessions||[]).map(u=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--admin-line)"><span>${u.first_name} ${u.last_name} · ${u.email}</span><small style="color:var(--admin-muted)">${u.last_login_at||"jamais"}</small></div>`).join("")}</div>
            <div><b>Activité récente</b><br><small style="color:var(--admin-muted)">${(d.recent_activity||[]).slice(0,3).map(a=>`${a.action} · ${a.created_at}`).join("<br>")||"—"}</small></div>
          </div>
        `;
      }catch(e){ $("#security").innerHTML=`<p style="color:#8A3A1F">${e.message}</p>`; }
    }
    guard();
  })();
  </script>

  <script>
  // Guard: normal Admin (products only) cannot access this page — redirect to products
  (function(){
    const _origMe = window.CLEO_API && window.CLEO_API.me;
    // Delay check after load
    document.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const me=await window.CLEO_API.me();
        if(me.authenticated && me.user.role==='admin'){
          document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--admin-bg)"><div style="max-width:520px;background:var(--admin-surface);border:1px solid var(--admin-line);border-radius:12px;padding:32px;text-align:center"><h2 style="font-family:var(--serif)">Accès réservé au Super Admin</h2><p style="color:var(--admin-muted);margin-top:12px">Votre rôle <b>Admin</b> donne accès uniquement à la gestion produits (catalogue, stocks, catégories, marques). Cette page nécessite le rôle <b>Super Admin</b> (nssm@cleopatre.tn).</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><a class="btn btn--ink" href="products.html">Aller aux produits</a><a class="btn btn--ghost" href="index.html">Tableau de bord</a></div><p style="font-size:.78rem;color:var(--admin-muted);margin-top:16px">Tentative d’accès direct à une API restreinte renverra <code>403 Permission insuffisante</code> — vérification serveur.</p></div></div>';
        }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
