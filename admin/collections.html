<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Collections — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="admin-side" id="adminSide"><div class="admin-brand"><b>Cléopâtre</b><small>Administration</small></div><nav class="admin-nav"><a href="index.html">? Tableau</a><a href="products.html">? Produits</a><a href="collections.html" class="is-on">? Collections</a><a href="promotions.html">% Promotions</a><a href="customers.html">? Clients</a><div class="nav-sep"></div><a href="../index.html">? Boutique</a><a href="#" id="logout">? Déconnexion</a></nav></aside>
    <div>
      <header class="admin-top"><div style="display:flex;gap:10px;align-items:center"><!-- desktop-only: mobile toggle removed --><div><h1>Collections</h1><small>Curations : Routine Hydratation, Essentiels SPF, etc. Produits multi-collections.</small></div></div><button class="btn btn--ink btn--sm" id="newBtn">+ Collection</button></header>
      <div class="admin-content">
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Nom</th><th>Slug</th><th>Produits</th><th>Active</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
        <div class="card" id="detail" style="display:none"><div class="card-head"><h2 id="dTitle"></h2><button class="btn btn--ghost btn--sm" onclick="document.getElementById('detail').style.display='none'">Fermer</button></div><div style="padding:16px"><div class="filters"><input id="addPid" placeholder="ID produit (ex: avene-eau-thermale-300)"><button class="btn btn--ink btn--sm" id="addProd">Ajouter</button></div><div id="dProducts" style="margin-top:12px;display:grid;gap:8px"></div></div></div>
      </div>
    </div>
  </div>
  <!-- desktop-only: bottom nav removed -->
  <div class="toast-zone" id="toastZone"></div>
  <div class="modal-admin" id="createModal"><div class="modal-panel"><h3 style="font-family:var(--serif)">Nouvelle collection</h3><div style="display:grid;gap:10px;margin-top:12px"><input id="cName" placeholder="Nom *"><input id="cSlug" placeholder="slug (auto si vide)"><textarea id="cDesc" rows="2" placeholder="Description" style="border:1px solid var(--admin-line);padding:10px;border-radius:8px"></textarea><div style="display:flex;gap:8px"><button class="btn btn--ink btn--sm" id="cSave">Créer</button><button class="btn btn--ghost btn--sm" data-close>Annuler</button></div></div></div></div>
  <script src="../js/api.js"></script>
  <script>
  (function(){
    const API=window.CLEO_API, $=s=>document.querySelector(s);
    function toast(m,t='info'){ const z=$("#toastZone"); const n=document.createElement('div'); n.className='toast '+t; n.textContent=m; z.appendChild(n); setTimeout(()=>{n.style.opacity='0';setTimeout(()=>n.remove(),300)},3000)}
    let selected=null;
    async function guard(){ const me=await API.me(); if(!me.authenticated||!["admin","super_admin","manager","staff"].includes(me.user.role)) location.href="login.html"; else init(); }
    async function init(){
      $("#logout").addEventListener("click", async e=>{e.preventDefault();await API.logout();location.href="login.html";});
      /* desktop-only: navToggle removed */
      $("#newBtn").addEventListener("click", ()=> $("#createModal").classList.add("is-on"));
      document.querySelectorAll("[data-close]").forEach(b=> b.addEventListener("click", ()=> b.closest(".modal-admin").classList.remove("is-on")));
      $("#createModal").addEventListener("click", e=>{ if(e.target.id==="createModal") e.currentTarget.classList.remove("is-on")});
      $("#cSave").addEventListener("click", async()=>{
        try{ await API.admin.collectionCreate({name:$("#cName").value.trim(), slug:$("#cSlug").value.trim()||undefined, description:$("#cDesc").value.trim()}); toast("Créée","ok"); $("#createModal").classList.remove("is-on"); load(); }catch(e){ toast(e.message,"err")}
      });
      $("#addProd").addEventListener("click", async()=>{
        const pid=$("#addPid").value.trim(); if(!pid) return;
        try{ await API.admin.collectionAddProduct(selected, pid); toast("Ajouté","ok"); open(selected); }catch(e){ toast(e.message,"err")}
      });
      load();
    }
    async function load(){
      $("#tbody").innerHTML=`<tr><td colspan="5" style="text-align:center;color:var(--admin-muted)">Chargement…</td></tr>`;
      try{
        const res=await API.admin.collections();
        const rows=res.data.collections||[];
        if(!rows.length) $("#tbody").innerHTML=`<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--admin-muted)">Aucune collection.</td></tr>`;
        else $("#tbody").innerHTML=rows.map(c=>`<tr><td><b>${c.name}</b><br><small style="color:var(--admin-muted)">${c.description||""}</small></td><td>${c.slug}</td><td>${c.product_count}</td><td>${c.active?'<span class="badge badge--green">Active</span>':'<span class="badge badge--red">Inactive</span>'}</td><td><button class="btn btn--ghost btn--sm" data-open="${c.id}">Voir</button><button class="btn btn--ghost btn--sm" data-del="${c.id}" style="color:var(--admin-danger)">Suppr.</button></td></tr>`).join("");
        document.querySelectorAll("[data-open]").forEach(b=> b.addEventListener("click", ()=> open(b.dataset.open)));
        document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", async()=>{
          if(!confirm("Supprimer collection ?")) return;
          try{ await fetch(`../api/admin/collections.php?id=${b.dataset.del}`,{method:"DELETE", credentials:"same-origin", headers:{"X-CSRF-Token":API.csrfToken}}).then(r=>r.json()).then(j=>{if(!j.success)throw new Error(j.message)}); toast("Supprimée","ok"); load(); }catch(e){ toast(e.message,"err")}
        }));
      }catch(e){ $("#tbody").innerHTML=`<tr><td colspan="5" style="color:#8A3A1F">${e.message}</td></tr>`; }
    }
    async function open(id){
      selected=id;
      $("#detail").style.display="block";
      $("#dProducts").innerHTML="Chargement…";
      try{
        // fetch via slug? need to get collections and map id->slug
        const res=await API.admin.collections();
        const col=(res.data.collections||[]).find(c=> String(c.id)===String(id));
        if(!col) throw new Error("Introuvable");
        $("#dTitle").textContent=col.name+" · "+col.slug;
        const det=await fetch(`../api/admin/collections.php?slug=${encodeURIComponent(col.slug)}`,{credentials:"same-origin"}).then(r=>r.json());
        const prods=det.data.products||[];
        if(!prods.length) $("#dProducts").innerHTML=`<p style="color:var(--admin-muted)">Aucun produit dans cette collection.</p>`;
        else $("#dProducts").innerHTML=prods.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--admin-line);border-radius:8px"><span><b>${p.name}</b><br><small style="color:var(--admin-muted)">${p.id} · ${p.brand}</small></span><button class="btn btn--ghost btn--sm" data-rm="${p.id}" style="color:var(--admin-danger)">Retirer</button></div>`).join("");
        document.querySelectorAll("[data-rm]").forEach(b=> b.addEventListener("click", async()=>{
          try{ await fetch("../api/admin/collections.php",{method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json","X-CSRF-Token":API.csrfToken}, body:JSON.stringify({action:"remove_product", collection_id:id, product_id:b.dataset.rm})}).then(r=>r.json()).then(j=>{if(!j.success)throw new Error(j.message)}); toast("Retiré","ok"); open(id); }catch(e){ toast(e.message,"err")}
        }));
      }catch(e){ $("#dProducts").textContent=e.message; }
    }
    guard();
  })();
  </script>

  <script>
  // Guard: normal Admin (products only) cannot access this page — redirect to products
  (function(){
    const _origMe = window.CLEO_API && window.CLEO_API.me;
    // Delay check after load
    document.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const me=await window.CLEO_API.me();
        if(me.authenticated && me.user.role==='admin'){
          document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--admin-bg)"><div style="max-width:520px;background:var(--admin-surface);border:1px solid var(--admin-line);border-radius:12px;padding:32px;text-align:center"><h2 style="font-family:var(--serif)">Accès réservé au Super Admin</h2><p style="color:var(--admin-muted);margin-top:12px">Votre rôle <b>Admin</b> donne accès uniquement à la gestion produits (catalogue, stocks, catégories, marques). Cette page nécessite le rôle <b>Super Admin</b> (nssm@cleopatre.tn).</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><a class="btn btn--ink" href="products.html">Aller aux produits</a><a class="btn btn--ghost" href="index.html">Tableau de bord</a></div><p style="font-size:.78rem;color:var(--admin-muted);margin-top:16px">Tentative d’accès direct à une API restreinte renverra <code>403 Permission insuffisante</code> — vérification serveur.</p></div></div>';
        }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
